azure:
  keyvault:
    uri: https://amportfoliokeyvault.vault.azure.net/

spring:
  application:
    name: stock-data
  datasource:
     url: jdbc:postgresql://localhost:5432/investment
     username: adminuser
     password: password
     driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  springdoc:
    swagger-ui:
      path: /swagger-ui.html
      enabled: true
    api-docs:
      path: /v3/api-docs
      enabled: true
  mvc:
    view:
      prefix: /
      suffix: .html
    static-path-pattern: /static/**
  web:
    resources:
      static-locations: classpath:/static/
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    view-names: index, upload, portfolio-result, error
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
