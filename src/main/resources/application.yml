
azure:
  keyvault:
    uri: https://amportfoliokeyvault.vault.azure.net/

spring:
  application:
    name: stock-data
  datasource:
     url: jdbc:postgresql://localhost:5432/investment
     username: adminuser
     password: password
     driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
