<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Portfolio Results</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4" th:text="${platform} + ' Portfolio Results'"></h1>
        <div class="table-responsive">
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>Stock Symbol</th>
                        <th>Quantity</th>
                        <th>Average Price</th>
                        <th>Current Price</th>
                        <th>Total Investment</th>
                        <th>Current Value</th>
                        <th>Profit/Loss</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="stock : ${portfolioData}">
                        <td th:text="${stock.symbol}"></td>
                        <td th:text="${stock.quantity}"></td>
                        <td th:text="${#numbers.formatDecimal(stock.averagePrice, 0, 2)}"></td>
                        <td th:text="${#numbers.formatDecimal(stock.currentPrice, 0, 2)}"></td>
                        <td th:text="${#numbers.formatDecimal(stock.totalInvestment, 0, 2)}"></td>
                        <td th:text="${#numbers.formatDecimal(stock.currentValue, 0, 2)}"></td>
                        <td th:text="${#numbers.formatDecimal(stock.profitLoss, 0, 2)}" 
                            th:classappend="${stock.profitLoss >= 0 ? 'text-success' : 'text-danger'}">
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="text-center mt-3">
            <a href="/upload" class="btn btn-primary">Upload Another Portfolio</a>
            <a href="/" class="btn btn-secondary">Back to Home</a>
        </div>
    </div>
    <script th:src="@{/webjars/bootstrap/5.3.2/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
