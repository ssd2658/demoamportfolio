<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Portfolio Upload Result</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}">
</head>
<body>
    <div class="container mt-5">
        <div class="card">
            <div class="card-header bg-success text-white">
                <h2 class="card-title mb-0">Portfolio Upload Successful</h2>
            </div>
            <div class="card-body">
                <div class="alert alert-info">
                    <strong>Platform:</strong> <span th:text="${platform}">Platform Name</span>
                </div>
                
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>Symbol</th>
                            <th>Quantity</th>
                            <th>Average Price</th>
                            <th>Invested Value</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="stock : ${result}">
                            <td th:text="${stock.symbol}">SYMBOL</td>
                            <td th:text="${stock.quantity}">0</td>
                            <td th:text="${#numbers.formatDecimal(stock.avePrice, 0, 2, 'POINT')}">0.00</td>
                            <td th:text="${#numbers.formatDecimal(stock.investedValue, 0, 2, 'POINT')}">0.00</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="card-footer">
                <a href="/" class="btn btn-primary">Back to Home</a>
                <a href="/view-portfolio" class="btn btn-secondary ms-2">View Full Portfolio</a>
            </div>
        </div>
    </div>
    <script th:src="@{/webjars/bootstrap/5.3.2/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
