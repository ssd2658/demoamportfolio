<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- Header CSS Fragment -->
    <th:block th:fragment="header-css">
        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <!-- Custom CSS -->
        <link th:href="@{/css/custom.css}" rel="stylesheet">
    </th:block>
</head>
<body>
    <!-- Header Fragment -->
    <nav th:fragment="header" class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/}">Investment Portfolio</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/view-portfolio}">Portfolio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/stocks}">Stocks</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Scripts Fragment -->
    <th:block th:fragment="scripts">
        <!-- Bootstrap JS Bundle with Popper -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    </th:block>
</body>
</html>
