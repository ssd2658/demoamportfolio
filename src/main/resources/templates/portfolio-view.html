<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Portfolio View</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.11.5/css/dataTables.bootstrap5.min.css">
    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Arial', sans-serif;
        }
        .portfolio-card {
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .portfolio-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
        }
        .portfolio-header {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white;
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
        }
        .summary-card {
            background-color: #f8f9fa;
            border-radius: 10px;
            transition: transform 0.3s;
        }
        .summary-card:hover {
            transform: scale(1.05);
        }
        .table-responsive {
            max-height: 500px;
            overflow-y: auto;
            border-radius: 10px;
        }
        .positive {
            color: #28a745;
            font-weight: bold;
        }
        .negative {
            color: #dc3545;
            font-weight: bold;
        }
        .btn-custom {
            transition: all 0.3s ease;
        }
        .btn-custom:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-12">
                <div class="card portfolio-card">
                    <div class="card-header portfolio-header d-flex justify-content-between align-items-center">
                        <h3 class="mb-0">
                            <i class="fas fa-chart-line me-3"></i>Portfolio Overview
                        </h3>
                        <div>
                            <a href="/upload" class="btn btn-light me-2 btn-custom">
                                <i class="fas fa-upload me-2"></i>Upload New Portfolio
                            </a>
                            <button id="downloadBtn" class="btn btn-success btn-custom">
                                <i class="fas fa-download me-2"></i>Download Portfolio
                            </button>
                        </div>
                    </div>
                    <div class="card-body">
                        <div th:if="${#lists.isEmpty(portfolioData)}" class="alert alert-warning text-center">
                            <i class="fas fa-exclamation-triangle me-2"></i>
                            No portfolio data available. Please upload a portfolio first.
                        </div>
                        
                        <div th:unless="${#lists.isEmpty(portfolioData)}">
                            <div class="row mb-4">
                                <div class="col-md-4 mb-3">
                                    <div class="card summary-card text-center p-3">
                                        <h5 class="card-title">Total Investment</h5>
                                        <p class="card-text h4" th:text="${totalInvestment}">₹0</p>
                                    </div>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <div class="card summary-card text-center p-3">
                                        <h5 class="card-title">Current Value</h5>
                                        <p class="card-text h4" th:text="${currentValue}">₹0</p>
                                    </div>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <div class="card summary-card text-center p-3">
                                        <h5 class="card-title">Profit/Loss</h5>
                                        <p class="card-text h4" 
                                           th:classappend="${profitLoss >= 0 ? 'positive' : 'negative'}"
                                           th:text="${profitLoss}">₹0</p>
                                    </div>
                                </div>
                            </div>

                            <div class="table-responsive">
                                <table id="portfolioTable" class="table table-striped table-hover">
                                    <thead>
                                        <tr>
                                            <th>Stock</th>
                                            <th>Quantity</th>
                                            <th>Buy Price</th>
                                            <th>Current Price</th>
                                            <th>Total Investment</th>
                                            <th>Current Value</th>
                                            <th>Profit/Loss</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="stock : ${portfolioData}">
                                            <td th:text="${stock.symbol}"></td>
                                            <td th:text="${stock.quantity}"></td>
                                            <td th:text="${stock.avePrice}"></td>
                                            <td th:text="${stock.currentPrice}"></td>
                                            <td th:text="${stock.totalInvestment}"></td>
                                            <td th:text="${stock.currentValue}"></td>
                                            <td th:classappend="${stock.currentPrice >= stock.avePrice ? 'positive' : 'negative'}"
                                                th:text="${stock.profitLoss}"></td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/webjars/bootstrap/5.3.2/js/bootstrap.bundle.min.js}"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/dataTables.bootstrap5.min.js"></script>
    <script>
        $(document).ready(function() {
            $('#portfolioTable').DataTable({
                pageLength: 10,
                lengthMenu: [[10, 25, 50, -1], [10, 25, 50, "All"]],
                language: {
                    search: '<i class="fas fa-search"></i>',
                    searchPlaceholder: 'Search stocks...'
                }
            });

            $('#downloadBtn').on('click', function() {
                // Placeholder for download functionality
                alert('Download functionality coming soon!');
            });
        });
    </script>
</body>
