<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Portfolio Upload Center</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-color: #f4f6f9;
        }
        .upload-card {
            transition: transform 0.3s, box-shadow 0.3s;
            border-radius: 12px;
            overflow: hidden;
        }
        .upload-card:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .upload-card .card-header {
            background-color: #007bff;
            color: white;
            text-align: center;
            padding: 15px;
        }
        .file-input {
            opacity: 0;
            position: absolute;
            z-index: -1;
        }
        .file-label {
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px dashed #007bff;
            padding: 20px;
            text-align: center;
            transition: background-color 0.3s;
        }
        .file-label:hover {
            background-color: rgba(0, 123, 255, 0.1);
        }
        .file-name {
            margin-left: 10px;
            max-width: 200px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-10">
                <h1 class="text-center mb-5">
                    <i class="fas fa-chart-line"></i> Portfolio Upload Center
                </h1>
                <div class="row">
                    <div class="col-md-4 mb-4">
                        <div class="card upload-card shadow-sm">
                            <div class="card-header">
                                <i class="fas fa-chart-pie"></i> Dhan Portfolio
                            </div>
                            <div class="card-body">
                                <form th:action="@{/upload/dhan}" method="post" enctype="multipart/form-data" id="dhanForm">
                                    <input type="file" name="file" class="file-input" id="dhanFile" accept=".csv,.xlsx" required>
                                    <label for="dhanFile" class="file-label w-100">
                                        <i class="fas fa-cloud-upload-alt fa-2x text-primary mr-3"></i>
                                        <span class="file-name" id="dhanFileName">Choose Dhan Portfolio File</span>
                                    </label>
                                    <button type="submit" class="btn btn-primary w-100 mt-3">
                                        <i class="fas fa-upload"></i> Upload Dhan Portfolio
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4 mb-4">
                        <div class="card upload-card shadow-sm">
                            <div class="card-header">
                                <i class="fas fa-piggy-bank"></i> MStock Portfolio
                            </div>
                            <div class="card-body">
                                <form th:action="@{/upload/mstock}" method="post" enctype="multipart/form-data" id="mstockForm">
                                    <input type="file" name="file" class="file-input" id="mstockFile" accept=".csv,.xlsx" required>
                                    <label for="mstockFile" class="file-label w-100">
                                        <i class="fas fa-cloud-upload-alt fa-2x text-success mr-3"></i>
                                        <span class="file-name" id="mstockFileName">Choose MStock Portfolio File</span>
                                    </label>
                                    <button type="submit" class="btn btn-success w-100 mt-3">
                                        <i class="fas fa-upload"></i> Upload MStock Portfolio
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4 mb-4">
                        <div class="card upload-card shadow-sm">
                            <div class="card-header">
                                <i class="fas fa-money-check-alt"></i> Zerodha Portfolio
                            </div>
                            <div class="card-body">
                                <form th:action="@{/upload/zerodha}" method="post" enctype="multipart/form-data" id="zerodhaForm">
                                    <input type="file" name="file" class="file-input" id="zerodhaFile" accept=".csv,.xlsx" required>
                                    <label for="zerodhaFile" class="file-label w-100">
                                        <i class="fas fa-cloud-upload-alt fa-2x text-info mr-3"></i>
                                        <span class="file-name" id="zerodhaFileName">Choose Zerodha Portfolio File</span>
                                    </label>
                                    <button type="submit" class="btn btn-info w-100 mt-3">
                                        <i class="fas fa-upload"></i> Upload Zerodha Portfolio
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="text-center mt-4">
                    <a href="/" class="btn btn-secondary">
                        <i class="fas fa-home"></i> Back to Home
                    </a>
                </div>
            </div>
        </div>
    </div>
    <script th:src="@{/webjars/bootstrap/5.3.2/js/bootstrap.bundle.min.js}"></script>
    <script>
        document.querySelectorAll('.file-input').forEach(input => {
            input.addEventListener('change', function() {
                const fileName = this.files[0] ? this.files[0].name : 'Choose Portfolio File';
                const fileNameSpan = document.getElementById(this.id + 'Name');
                fileNameSpan.textContent = fileName;
            });
        });
    </script>
</body>
</html>
